name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall src jk_client.py

      - name: CLI help
        run: |
          jk --help
          jk exec --help
          jk kernels --help
          jk kernel start --help
          jk kernel stop --help
          jk skill --help

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Test installer and bundled distributions
        env:
          JK_TEST_DIST_DIR: ${{ github.workspace }}/dist
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "${{ github.workspace }}/tests" -v
